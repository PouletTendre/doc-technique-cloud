<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dns64-nat64-title dns64-nat64-desc" id="d-05-dns64-nat64-unbound-root">
        <title id="dns64-nat64-title">Résolution DNS64 Unbound et translation Tayga NAT64</title>
        <desc id="dns64-nat64-desc">Diagramme de séquence décrivant comment un pod IPv6 interroge CoreDNS puis Unbound DNS64 pour obtenir une adresse synthétique 64:ff9b::/96, traduite ensuite en IPv4 par Tayga NAT64 et nat-gw.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #d-05-dns64-nat64-unbound-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #d-05-dns64-nat64-unbound-root { font-family: var(--font-sans); color: var(--color-ink); }
      #d-05-dns64-nat64-unbound-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#d-05-dns64-nat64-unbound-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="d-05-dns64-nat64-unbound-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="d-05-dns64-nat64-unbound-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="d-05-dns64-nat64-unbound-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Lifelines: 108, 300, 500, 692, 860 -->
        <line x1="108" y1="108" x2="108" y2="536" stroke="#2d3142" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.22"/>
        <line x1="300" y1="108" x2="300" y2="536" stroke="#2d3142" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.22"/>
        <line x1="500" y1="108" x2="500" y2="536" stroke="#2d3142" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.22"/>
        <line x1="692" y1="108" x2="692" y2="536" stroke="#2d3142" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.22"/>
        <line x1="860" y1="108" x2="860" y2="536" stroke="#2d3142" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.22"/>

        <!-- Activation bars -->
        <rect x="296" y="152" width="8" height="164" fill="#2d3142" stroke="#4f5d75" stroke-width="0.8" fill-opacity="0.06"/>
        <rect x="496" y="188" width="8" height="96" fill="#2d3142" stroke="#4f5d75" stroke-width="0.8" fill-opacity="0.06"/>
        <rect x="496" y="348" width="8" height="164" fill="#2d3142" stroke="#4f5d75" stroke-width="0.8" fill-opacity="0.06"/>
        <rect x="688" y="384" width="8" height="96" fill="#2d3142" stroke="#4f5d75" stroke-width="0.8" fill-opacity="0.06"/>

        <!-- Message arrows -->
        <!-- 1: Pod -> CoreDNS -->
        <line x1="108" y1="152" x2="296" y2="152" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#d-05-dns64-nat64-unbound-arrow)"/>
        <!-- 2: CoreDNS -> Unbound -->
        <line x1="304" y1="188" x2="496" y2="188" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#d-05-dns64-nat64-unbound-arrow)"/>
        <!-- 3: Unbound -> Internet (AAAA abs -> A 1.2.3.4) -->
        <line x1="504" y1="224" x2="860" y2="224" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#d-05-dns64-nat64-unbound-arrow-link)"/>
        <!-- 4: Internet -> Unbound (record A) -->
        <line x1="860" y1="260" x2="504" y2="260" stroke="#4f5d75" stroke-width="1.1" stroke-dasharray="5,4" marker-end="url(#d-05-dns64-nat64-unbound-arrow)"/>
        <!-- 5: Unbound -> CoreDNS (DNS64 synth 64:ff9b::...) -->
        <line x1="496" y1="284" x2="304" y2="284" stroke="#bf4520" stroke-width="1.4" marker-end="url(#d-05-dns64-nat64-unbound-arrow-accent)"/>
        <!-- 6: CoreDNS -> Pod -->
        <line x1="296" y1="316" x2="108" y2="316" stroke="#4f5d75" stroke-width="1.1" stroke-dasharray="5,4" marker-end="url(#d-05-dns64-nat64-unbound-arrow)"/>

        <!-- 7: Pod -> OPNsense Tayga (IPv6 dst 64:ff9b::...) -->
        <line x1="108" y1="352" x2="496" y2="352" stroke="#bf4520" stroke-width="1.4" marker-end="url(#d-05-dns64-nat64-unbound-arrow-accent)"/>
        <!-- 8: OPNsense Tayga -> nat-gw (IPv4 src 10.254.0.6) -->
        <line x1="504" y1="388" x2="688" y2="388" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#d-05-dns64-nat64-unbound-arrow)"/>
        <!-- 9: nat-gw -> Internet (SNAT IPv4 VLAN 52) -->
        <line x1="696" y1="424" x2="860" y2="424" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#d-05-dns64-nat64-unbound-arrow-link)"/>
        <!-- 10: Internet -> nat-gw -->
        <line x1="860" y1="456" x2="696" y2="456" stroke="#4f5d75" stroke-width="1.1" stroke-dasharray="5,4" marker-end="url(#d-05-dns64-nat64-unbound-arrow)"/>
        <!-- 11: nat-gw -> OPNsense -->
        <line x1="688" y1="480" x2="504" y2="480" stroke="#4f5d75" stroke-width="1.1" stroke-dasharray="5,4" marker-end="url(#d-05-dns64-nat64-unbound-arrow)"/>
        <!-- 12: OPNsense -> Pod -->
        <line x1="496" y1="512" x2="108" y2="512" stroke="#4f5d75" stroke-width="1.1" stroke-dasharray="5,4" marker-end="url(#d-05-dns64-nat64-unbound-arrow)"/>

        <!-- Message labels -->
        <rect x="148" y="132" width="112" height="12" rx="2" fill="#f5f5f5"/>
        <text x="204" y="141" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">QUERY AAAA UDP:53</text>

        <rect x="348" y="168" width="104" height="12" rx="2" fill="#f5f5f5"/>
        <text x="400" y="177" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FORWARD VIP:53</text>

        <rect x="612" y="204" width="136" height="12" rx="2" fill="#f5f5f5"/>
        <text x="680" y="213" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PAS D'AAAA -&gt; QUERY A</text>

        <rect x="628" y="240" width="104" height="12" rx="2" fill="#f5f5f5"/>
        <text x="680" y="249" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RETOUR IPV4 (A)</text>

        <rect x="336" y="264" width="128" height="12" rx="2" fill="#f5f5f5"/>
        <text x="400" y="273" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SYNTH 64:FF9B::/96</text>

        <rect x="144" y="296" width="120" height="12" rx="2" fill="#f5f5f5"/>
        <text x="204" y="305" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">AAAA SYNTHÉTIQUE</text>

        <rect x="204" y="332" width="192" height="12" rx="2" fill="#f5f5f5"/>
        <text x="300" y="341" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TCP 443 -&gt; 64:FF9B::IPV4</text>

        <rect x="528" y="368" width="136" height="12" rx="2" fill="#f5f5f5"/>
        <text x="596" y="377" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NAT64 10.254.0.6</text>

        <rect x="720" y="404" width="116" height="12" rx="2" fill="#f5f5f5"/>
        <text x="778" y="413" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SNAT MASQUERADE</text>

        <rect x="728" y="436" width="100" height="12" rx="2" fill="#f5f5f5"/>
        <text x="778" y="445" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RÉPONSE IPV4</text>

        <rect x="544" y="460" width="104" height="12" rx="2" fill="#f5f5f5"/>
        <text x="596" y="469" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">VLAN 780 -&gt; FW</text>

        <rect x="240" y="492" width="120" height="12" rx="2" fill="#f5f5f5"/>
        <text x="300" y="501" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RETOUR IPV6 GUA</text>

        <!-- Actor boxes (top) -->
        <rect x="36" y="44" width="144" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="36" y="44" width="144" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="108" y="72" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Pod IPv6</text>
        <text x="108" y="90" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">bb00::/60 ou bb10</text>

        <rect x="228" y="44" width="144" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="228" y="44" width="144" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="300" y="72" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">CoreDNS</text>
        <text x="300" y="90" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">kube-system</text>

        <rect x="424" y="44" width="152" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="424" y="44" width="152" height="64" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <text x="500" y="72" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">OPNsense HA</text>
        <text x="500" y="90" fill="#bf4520" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Unbound + Tayga</text>

        <rect x="620" y="44" width="144" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="620" y="44" width="144" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="692" y="72" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">nat-gw</text>
        <text x="692" y="90" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">10.254.0.1 · Eve</text>

        <rect x="792" y="44" width="136" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="792" y="44" width="136" height="64" rx="6" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <text x="860" y="72" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Cible IPv4</text>
        <text x="860" y="90" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Registry / API</text>

        <!-- Legend strip -->
        <line x1="40" y1="564" x2="920" y2="564" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>
        <text x="40" y="584" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LÉGENDE</text>

        <line x1="40" y1="605" x2="72" y2="605" stroke="#bf4520" stroke-width="1.4" marker-end="url(#d-05-dns64-nat64-unbound-arrow-accent)"/>
        <text x="80" y="608" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Synthèse et trafic 64:ff9b::/96</text>

        <line x1="292" y1="605" x2="324" y2="605" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#d-05-dns64-nat64-unbound-arrow-link)"/>
        <text x="332" y="608" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Sortie vers Internet</text>

        <line x1="484" y1="605" x2="516" y2="605" stroke="#4f5d75" stroke-width="1.1" stroke-dasharray="5,4" marker-end="url(#d-05-dns64-nat64-unbound-arrow)"/>
        <text x="524" y="608" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Réponse DNS ou flux retour traduit</text>
      </svg>
