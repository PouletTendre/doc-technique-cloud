<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peering eBGP entre Cilium 1.19 et FRR OPNsense · Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 1280px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Réseau Kubernetes</p>
    <h1>Peering eBGP Cilium 1.19 / FRR, pools LoadBalancer et chiffrement WireGuard</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1280 680" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ebgp-cilium-frr-title ebgp-cilium-frr-desc">
        <title id="ebgp-cilium-frr-title">Peering eBGP entre Cilium 1.19 et FRR sur OPNsense</title>
        <desc id="ebgp-cilium-frr-desc">Annonce dynamique des préfixes /64 de pods et des VIP LoadBalancer depuis les deux clusters Kubernetes vers fw1 et fw2 via eBGP sur TCP 179.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>

          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Zones -->
        <rect x="40" y="36" width="320" height="532" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="56" y="40" width="160" height="12" rx="2" fill="#f5f5f5"/>
        <text x="136" y="49" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">OPNsense FRR · AS 65000</text>

        <rect x="440" y="36" width="800" height="248" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="456" y="40" width="224" height="12" rx="2" fill="#f5f5f5"/>
        <text x="568" y="49" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">CLUSTER INTERNE · VLAN 770 · AS 65001</text>

        <rect x="440" y="320" width="800" height="248" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="456" y="324" width="216" height="12" rx="2" fill="#f5f5f5"/>
        <text x="564" y="333" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">CLUSTER CLIENT · VLAN 769 · AS 65002</text>

        <!-- Arrows (drawn first) -->
        <!-- Cluster Interne -> fw1 (:fffe) -->
        <line x1="472" y1="136" x2="320" y2="136" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <!-- Cluster Interne -> fw2 (:fffd) -->
        <path d="M 472,172 H 404 Q 396,172 396,180 V 420 Q 396,428 388,428 H 320" fill="none" stroke="#4f5d75" stroke-width="1.1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

        <!-- Cluster Client -> fw1 (:fffe) with hop over horizontal? Route cleanly on x=376 -->
        <path d="M 472,424 H 384 Q 376,424 376,416 V 180 Q 376,172 368,172 H 320" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <!-- Cluster Client -> fw2 (:fffd) -->
        <line x1="472" y1="460" x2="320" y2="460" stroke="#4f5d75" stroke-width="1.1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

        <!-- Node to Pods/LB internal arrows -->
        <path d="M 732,128 H 832 Q 840,128 840,120 V 112 Q 840,104 848,104 H 908" fill="none" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#arrow)"/>
        <path d="M 732,176 H 832 Q 840,176 840,184 V 200 Q 840,208 848,208 H 908" fill="none" stroke="#2e5aa8" stroke-width="1.1" marker-end="url(#arrow-link)"/>

        <path d="M 732,416 H 832 Q 840,416 840,408 V 400 Q 840,392 848,392 H 908" fill="none" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#arrow)"/>
        <path d="M 732,464 H 832 Q 840,464 840,472 V 488 Q 840,496 848,496 H 908" fill="none" stroke="#2e5aa8" stroke-width="1.1" marker-end="url(#arrow-link)"/>

        <!-- WireGuard inter-node indicator inside Interne & Client -->
        <line x1="600" y1="212" x2="600" y2="252" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
        <line x1="600" y1="496" x2="600" y2="536" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>

        <!-- Arrow labels -->
        <rect x="348" y="112" width="108" height="12" rx="2" fill="#f5f5f5"/>
        <text x="402" y="121" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">eBGP TCP 179</text>

        <rect x="348" y="436" width="108" height="12" rx="2" fill="#f5f5f5"/>
        <text x="402" y="445" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SESSION BACKUP</text>

        <rect x="752" y="84" width="104" height="12" rx="2" fill="#f5f5f5"/>
        <text x="804" y="93" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NATIVE ROUTING</text>

        <rect x="760" y="216" width="88" height="12" rx="2" fill="#f5f5f5"/>
        <text x="804" y="225" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LB IPAM + L7</text>

        <!-- Nodes: FRR Peers -->
        <rect x="72" y="96" width="248" height="112" rx="6" fill="#f5f5f5"/>
        <rect x="72" y="96" width="248" height="112" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <rect x="80" y="104" width="56" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.50)" stroke-width="0.8"/>
        <text x="108" y="113" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FRR ACTIF</text>
        <text x="196" y="136" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">fw1 (CARP Master)</text>
        <text x="196" y="156" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Peer :fffe · router-id 10.254.0.5</text>
        <text x="196" y="172" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Timers 3s / 9s · PL-K8S-INT/CLI</text>

        <rect x="72" y="388" width="248" height="112" rx="6" fill="#f5f5f5"/>
        <rect x="72" y="388" width="248" height="112" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="80" y="396" width="64" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="112" y="405" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FRR BACKUP</text>
        <text x="196" y="428" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">fw2 (CARP Standby)</text>
        <text x="196" y="448" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Peer :fffd · router-id 10.254.0.4</text>
        <text x="196" y="464" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Sessions déjà montées (RTO &lt; 5s)</text>

        <!-- Cluster Interne Nodes -->
        <rect x="472" y="96" width="260" height="116" rx="6" fill="#f5f5f5"/>
        <rect x="472" y="96" width="260" height="116" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="480" y="104" width="60" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="510" y="113" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CILIUM</text>
        <text x="602" y="136" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">6 Nœuds Interne (bb20::1..6)</text>
        <text x="602" y="156" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">eBPF kubeProxyReplacement: true</text>
        <text x="602" y="172" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">WireGuard inter-nœuds + Multus OOB</text>

        <text x="602" y="266" fill="#5a6580" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Annonces filtrées par PL-K8S-INT</text>

        <rect x="908" y="68" width="300" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="908" y="68" width="300" height="72" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="1058" y="96" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Pool Pods Interne</text>
        <text x="1058" y="116" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">2001:678:3fc:bb00::/60 (1 x /64 par nœud)</text>

        <rect x="908" y="172" width="300" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="908" y="172" width="300" height="72" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="1058" y="200" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Pools LoadBalancer Interne</text>
        <text x="1058" y="220" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">bb21::/64 (Privé ::1..3) · bb22::/64 (Pub ::1)</text>

        <!-- Cluster Client Nodes -->
        <rect x="472" y="384" width="260" height="116" rx="6" fill="#f5f5f5"/>
        <rect x="472" y="384" width="260" height="116" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="480" y="392" width="60" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="510" y="401" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CILIUM</text>
        <text x="602" y="424" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">7 Nœuds Client (bb23::1..7)</text>
        <text x="602" y="444" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">CiliumBGPClusterConfig bgp-client</text>
        <text x="602" y="460" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">WireGuard inter-nœuds + Envoy L7</text>

        <text x="602" y="550" fill="#5a6580" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Annonces filtrées par PL-K8S-CLI</text>

        <rect x="908" y="356" width="300" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="908" y="356" width="300" height="72" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="1058" y="384" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Pool Pods Client</text>
        <text x="1058" y="404" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">2001:678:3fc:bb10::/60 (1 x /64 par nœud)</text>

        <rect x="908" y="460" width="300" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="908" y="460" width="300" height="72" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="1058" y="488" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Pool LoadBalancer Client</text>
        <text x="1058" y="508" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">bb24::/64 (::1 Envoy · ::100+ L4 campus)</text>

        <!-- Legend strip -->
        <line x1="40" y1="600" x2="1240" y2="600" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="620" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LÉGENDE</text>

        <line x1="40" y1="641" x2="72" y2="641" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="80" y="644" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Session eBGP principale vers fw1 (CARP Master)</text>

        <line x1="396" y1="641" x2="428" y2="641" stroke="#4f5d75" stroke-width="1.1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <text x="436" y="644" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Session eBGP redondante vers fw2 (Standby)</text>

        <line x1="744" y1="641" x2="776" y2="641" stroke="#2e5aa8" stroke-width="1.1" marker-end="url(#arrow-link)"/>
        <text x="784" y="644" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Attribution Cilium LB IPAM (/128 annoncées)</text>
      </svg>
    </div>
  </div>
