<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="topologie-reseau-title topologie-reseau-desc" id="d-03-topologie-reseau-flux-root">
        <title id="topologie-reseau-title">Topologie réseau IPv6-only et plan OOB</title>
        <desc id="topologie-reseau-desc">Architecture réseau reliant Internet et le campus à la paire de pare-feux OPNsense via nat-gw et cloudflared, vers les VLANs routés GUA et le réseau d'administration hors bande ULA VLAN 790.</desc>
