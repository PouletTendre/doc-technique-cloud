<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="stack-logs-title stack-logs-desc" id="d-07-stack-logs-victoria-root">
        <title id="stack-logs-title">Pipeline de journalisation centralisée VictoriaLogs</title>
        <desc id="stack-logs-desc">Flux des journaux des conteneurs, des VMs Ubuntu, des pare-feux OPNsense et des drops Hubble collectés sur le VLAN 790 OOB vers VictoriaLogs puis exploités dans Grafana et Grafana Alerting.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #d-07-stack-logs-victoria-root { --paper: #f5f5f5; --paper-2: #ececec; --ink: #2d3142; --muted: #4f5d75;
      --soft: #5a6580; --rule: rgba(45,49,66,0.12); --accent: #bf4520;
      --accent-tint: rgba(191,69,32,0.08); --link: #2e5aa8;
      --sans: 'Geist', system-ui, sans-serif; --serif: 'Instrument Serif', serif;
      --mono: 'Geist Mono', ui-monospace, monospace; }
      #d-07-stack-logs-victoria-root { color: var(--ink); font-family: var(--sans); }
      #d-07-stack-logs-victoria-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#d-07-stack-logs-victoria-root .diagram-container { overflow-x: visible; }
}
      #d-07-stack-logs-victoria-root .step-number, #d-07-stack-logs-victoria-root .step-label, #d-07-stack-logs-victoria-root .lane-label, #d-07-stack-logs-victoria-root .role-text, #d-07-stack-logs-victoria-root .chip-text, #d-07-stack-logs-victoria-root .legend-label { font-family: var(--mono); text-anchor: middle; }
      #d-07-stack-logs-victoria-root .step-number { fill: var(--ink); font-size: 7px; font-weight: 600; }
      #d-07-stack-logs-victoria-root .step-label { fill: var(--muted); font-size: 7px; font-weight: 500; letter-spacing: 0.12em; }
      #d-07-stack-logs-victoria-root .lane-label { fill: var(--muted); font-size: 8px; font-weight: 500; letter-spacing: 0.14em; }
      #d-07-stack-logs-victoria-root .role-text { fill: var(--ink); font-size: 6px; font-weight: 600; }
      #d-07-stack-logs-victoria-root .node-title { fill: var(--ink); font: 600 9px var(--sans); text-anchor: middle; }
      #d-07-stack-logs-victoria-root .node-sub { fill: var(--muted); font: 400 6.5px var(--mono); text-anchor: middle; }
      #d-07-stack-logs-victoria-root .node-tool { fill: var(--soft); font: 400 6.5px var(--mono); text-anchor: middle; }
      #d-07-stack-logs-victoria-root .chip-text { fill: #fff; font-size: 5px; font-weight: 700; }
      #d-07-stack-logs-victoria-root .focal-text { fill: var(--accent); }
      #d-07-stack-logs-victoria-root .legend-label { fill: var(--muted); font-size: 7px; font-weight: 500; letter-spacing: 0.12em; text-anchor: end; }
      #d-07-stack-logs-victoria-root .legend-text { fill: var(--muted); font: 400 7px var(--sans); }</style>
          <marker id="d-07-stack-logs-victoria-arr-muted" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#4f5d75"/></marker>
          <marker id="d-07-stack-logs-victoria-arr-accent" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#bf4520"/></marker>
          <marker id="d-07-stack-logs-victoria-arr-link" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="960" height="460" fill="#f5f5f5"/>
        <rect x="0" y="36" width="960" height="80" fill="#2d3142" fill-opacity="0.018"/>
        <rect x="0" y="196" width="960" height="80" fill="#2d3142" fill-opacity="0.018"/>

        <!-- Grid structure: 5 steps starting at x=160, slot_w=152 -->
        <line x1="0" y1="36" x2="960" y2="36" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.12"/>
        <line x1="0" y1="116" x2="960" y2="116" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.12"/>
        <line x1="0" y1="196" x2="960" y2="196" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.12"/>
        <line x1="0" y1="276" x2="960" y2="276" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.12"/>
        <line x1="0" y1="356" x2="960" y2="356" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.12"/>
        <line x1="160" y1="36" x2="160" y2="356" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.12"/>

        <!-- Step headers (centers: 236, 388, 540, 692, 844) -->
        <g aria-label="Étapes du pipeline">
          <rect x="220" y="6" width="32" height="16" rx="8" fill="#2d3142" fill-opacity="0.12"/><text x="236" y="14" class="step-number">01</text><text x="236" y="29" class="step-label">ÉMISSION</text>
          <rect x="372" y="6" width="32" height="16" rx="8" fill="#2d3142" fill-opacity="0.12"/><text x="388" y="14" class="step-number">02</text><text x="388" y="29" class="step-label">COLLECTE</text>
          <rect x="524" y="6" width="32" height="16" rx="8" fill="#bf4520" fill-opacity="0.20"/><text x="540" y="14" class="step-number focal-text">03</text><text x="540" y="29" class="step-label focal-text">STOCKAGE 90J</text>
          <rect x="676" y="6" width="32" height="16" rx="8" fill="#2d3142" fill-opacity="0.12"/><text x="692" y="14" class="step-number">04</text><text x="692" y="29" class="step-label">ANALYSE</text>
          <rect x="828" y="6" width="32" height="16" rx="8" fill="#2d3142" fill-opacity="0.12"/><text x="844" y="14" class="step-number">05</text><text x="844" y="29" class="step-label">EXPLOITATION</text>
        </g>

        <!-- Role lanes -->
        <g aria-label="Couches d'origine">
          <text x="80" y="72" class="lane-label">CLUSTERS</text><text x="80" y="84" class="lane-label">KUBERNETES</text>
          <text x="80" y="152" class="lane-label">SYSTÈMES</text><text x="80" y="164" class="lane-label">VMS &amp; BASTION</text>
          <text x="80" y="232" class="lane-label">PARE-FEUX</text><text x="80" y="244" class="lane-label">OPNSENSE HA</text>
          <text x="80" y="312" class="lane-label">ADMIN</text><text x="80" y="324" class="lane-label">&amp; CLIENTS</text>
        </g>

