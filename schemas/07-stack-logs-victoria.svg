        <path d="M 300,156 H 324" fill="none" stroke="#4f5d75" marker-end="url(#d-07-stack-logs-victoria-arr-muted)"/>
        <path d="M 452,156 H 476" fill="none" stroke="#4f5d75" marker-end="url(#d-07-stack-logs-victoria-arr-muted)"/>

        <!-- Lane 2: 0->1->2 (up to VictoriaLogs) -->
        <path d="M 300,236 H 324" fill="none" stroke="#4f5d75" marker-end="url(#d-07-stack-logs-victoria-arr-muted)"/>
        <path d="M 452,236 H 532 Q 540,236 540,228 V 188" fill="none" stroke="#4f5d75" marker-end="url(#d-07-stack-logs-victoria-arr-muted)"/>

        <!-- VictoriaLogs -> Grafana (step 3 lane 3) -->
        <path d="M 604,156 H 684 Q 692,156 692,164 V 284" fill="none" stroke="#2e5aa8" marker-end="url(#d-07-stack-logs-victoria-arr-link)"/>
        <!-- Grafana -> Exploitation (step 4 lane 3) -->
        <path d="M 756,316 H 780" fill="none" stroke="#2e5aa8" marker-end="url(#d-07-stack-logs-victoria-arr-link)"/>

        <!-- Focal arrow label -->
        <rect x="464" y="56" width="68" height="12" rx="2" fill="#f5f5f5"/>
        <text x="498" y="65" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">OOB 1:5::2</text>

        <!-- Nodes (128x64, centered on step_cx) -->
