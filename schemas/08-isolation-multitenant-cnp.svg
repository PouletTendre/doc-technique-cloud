<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 660" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="isolation-multitenant-title isolation-multitenant-desc" id="d-08-isolation-multitenant-cnp-root">
        <title id="isolation-multitenant-title">Couches d'isolation multi-tenant du Cluster Client</title>
        <desc id="isolation-multitenant-desc">Pile des cinq couches de sécurité compensatoires protégeant l'infrastructure CaaScad contre une compromission ou une saturation depuis un conteneur client, avec la limite résiduelle du noyau Linux partagé.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #d-08-isolation-multitenant-cnp-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #d-08-isolation-multitenant-cnp-root { font-family: var(--font-sans); color: var(--color-ink); }
      #d-08-isolation-multitenant-cnp-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#d-08-isolation-multitenant-cnp-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="d-08-isolation-multitenant-cnp-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="d-08-isolation-multitenant-cnp-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Direction column (left margin) -->
        <text x="64" y="68" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em" text-anchor="middle">CONTENEUR</text>
        <line x1="64" y1="84" x2="64" y2="480" stroke="#2d3142" stroke-width="1" stroke-opacity="0.30"/>
        <polygon points="60,480 68,480 64,488" fill="#4f5d75"/>
        <text x="64" y="508" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em" text-anchor="middle">PÉRIMÈTRE</text>

        <!-- Outer hairline guides -->
        <line x1="128" y1="84" x2="920" y2="84" stroke="#2d3142" stroke-width="1" stroke-opacity="0.12"/>
        <line x1="128" y1="484" x2="920" y2="484" stroke="#2d3142" stroke-width="1" stroke-opacity="0.12"/>

        <!-- C1: Conteneur / PSS -->
        <rect x="128" y="84" width="792" height="80" fill="#ffffff"/>
        <line x1="128" y1="164" x2="920" y2="164" stroke="#2d3142" stroke-width="1" stroke-opacity="0.12"/>
        <text x="148" y="118" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">C1 · POD</text>
        <text x="260" y="120" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif">Pod Security Standards (restricted)</text>
        <text x="260" y="140" fill="#5a6580" font-size="9" font-family="'Geist Mono', monospace">Blocs privilèges, hostPath, root · Seccomp RuntimeDefault + AppArmor</text>
        <text x="900" y="120" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">automountToken: false</text>
        <text x="900" y="140" fill="#bf4520" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">Limite : noyau hôte partagé</text>

        <!-- C2: Namespace / Quotas -->
        <rect x="128" y="164" width="792" height="80" fill="#f5f5f5"/>
        <line x1="128" y1="244" x2="920" y2="244" stroke="#2d3142" stroke-width="1" stroke-opacity="0.12"/>
        <text x="148" y="198" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">C2 · TENANT</text>
        <text x="260" y="200" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif">Namespace dédié + Quotas</text>
        <text x="260" y="220" fill="#5a6580" font-size="9" font-family="'Geist Mono', monospace">Starter (2c/4G) · Standard (4c/8G) · Pro (8c/16G) · RBAC étanche</text>
        <text x="900" y="200" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">tenant-&lt;client&gt;</text>
        <text x="900" y="220" fill="#5a6580" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">Évite le noisy neighbor</text>

        <!-- C3: CiliumNetworkPolicy (FOCAL) -->
        <rect x="128" y="244" width="792" height="80" fill="#bf4520" fill-opacity="0.08"/>
        <rect x="128" y="244" width="792" height="80" fill="none" stroke="#bf4520" stroke-width="1"/>
        <text x="148" y="278" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em" font-weight="600">C3 · EBPF L3/4</text>
        <text x="260" y="280" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif">CiliumNetworkPolicy default-tenant-isolation</text>
        <text x="260" y="300" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">Autorise DNS:53 + Web 80/443 · Exclut ULA OOB, GUA internes et NAT64 privés</text>
        <text x="900" y="280" fill="#bf4520" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">Drops tracés par Hubble</text>
        <text x="900" y="300" fill="#bf4520" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">Bloque mouvement latéral</text>

        <!-- C4: Host Policy & nftables -->
        <rect x="128" y="324" width="792" height="80" fill="#ececec"/>
        <line x1="128" y1="404" x2="920" y2="404" stroke="#2d3142" stroke-width="1" stroke-opacity="0.12"/>
        <text x="148" y="358" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">C4 · HÔTE VM</text>
        <text x="260" y="360" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif">CiliumClusterwideHostPolicy + nftables oob_guard</text>
        <text x="260" y="380" fill="#5a6580" font-size="9" font-family="'Geist Mono', monospace">Bloque eth1 (VLAN 790) en forward · N'accepte que Bastion, Runner 1, ArgoCD, vmagent</text>
        <text x="900" y="360" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">Log "OOB-DROP: "</text>
        <text x="900" y="380" fill="#5a6580" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">Alerte critique immédiate</text>

        <!-- C5: OPNsense & Cluster dédié -->
        <rect x="128" y="404" width="792" height="80" fill="#ececec"/>
        <text x="148" y="438" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">C5 · PÉRIMÈTRE</text>
        <text x="260" y="440" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif">VMs séparées + Règle OPNsense F17 (DENY)</text>
        <text x="260" y="460" fill="#5a6580" font-size="9" font-family="'Geist Mono', monospace">Cluster Client (769) coupé du Cluster Interne (770) et des VLANs 758..763</text>
        <text x="900" y="440" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">Suricata IDS sur 769</text>
        <text x="900" y="460" fill="#5a6580" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">Default Drop All</text>

        <!-- Residual risk note -->
        <rect x="128" y="512" width="792" height="60" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="0.8" stroke-dasharray="4,3" stroke-opacity="0.20"/>
        <text x="148" y="536" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">RISQUE RÉSIDUEL</text>
        <text x="280" y="536" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Évasion noyau Linux sur nœud HCI Client (pas de VT-x imbriqué pour Kata)</text>
        <text x="280" y="554" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">Contenu aux VMs cli-* (C4/C5) · Piste de renfort ultérieur : gVisor (runsc) en espace utilisateur</text>

        <!-- Legend strip -->
        <line x1="40" y1="600" x2="920" y2="600" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>
        <text x="40" y="620" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LÉGENDE</text>

        <rect x="40" y="636" width="14" height="10" rx="2" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <text x="60" y="644" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Couche focale : filtrage réseau eBPF inter-tenants</text>

        <rect x="372" y="636" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.20"/>
        <text x="392" y="644" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Contrôles préventifs internes Kubernetes</text>

        <rect x="652" y="636" width="14" height="10" rx="2" fill="#ececec" stroke="#2d3142" stroke-width="1" stroke-opacity="0.20"/>
        <text x="672" y="644" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Barrières hôte et pare-feu périmétrique</text>
      </svg>
