<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chaîne GitOps Pull et séparation des runners · Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 1280px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Chaîne GitOps Pull</p>
    <h1>Chemin balisé Site Manager, GitLab et ArgoCD sans accès OOB exposé</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="chaine-gitops-title chaine-gitops-desc">
        <title id="chaine-gitops-title">Chaîne GitOps Pull via GitLab et ArgoCD</title>
        <desc id="chaine-gitops-desc">Architecture de déploiement montrant comment Site Manager écrit les manifests clients sur gitlab.inetdoc.net sans accéder au réseau OOB, avant qu'ArgoCD ne tire les manifests vers le cluster client via Multus VLAN 790.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Zones (max 3) -->
        <rect x="40" y="36" width="280" height="492" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="56" y="40" width="160" height="12" rx="2" fill="#f5f5f5"/>
        <text x="136" y="49" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">EXTÉRIEUR &amp; FORGE CAMPUS</text>

        <rect x="360" y="36" width="460" height="492" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="376" y="40" width="212" height="12" rx="2" fill="#f5f5f5"/>
        <text x="482" y="49" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">CLUSTER INTERNE &amp; RUNNERS (770 / 763)</text>

        <rect x="860" y="36" width="380" height="492" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="876" y="40" width="212" height="12" rx="2" fill="#f5f5f5"/>
        <text x="982" y="49" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">PLAN OOB 790 &amp; CLUSTER CLIENT (769)</text>

        <!-- Arrows (drawn first) -->
        <!-- Client -> Site Manager -->
        <line x1="292" y1="128" x2="392" y2="128" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <!-- Site Manager -> GitLab (commit YAML) -->
        <path d="M 392,152 H 348 Q 340,152 340,160 V 256 Q 340,264 332,264 H 292" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <!-- Site Manager -> Cloudflare API (direct bottom left route or right?) Route Site Manager top edge to Client Ingress or label -->
        <path d="M 628,128 H 896" fill="none" stroke="#2e5aa8" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-link)"/>

        <!-- GitLab -> ArgoCD (Pull sync) -->
        <line x1="292" y1="288" x2="548" y2="288" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

        <!-- ArgoCD -> API Cluster Client via Multus OOB -->
        <line x1="788" y1="288" x2="896" y2="288" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

        <!-- API Client -> Namespace tenant-<client> -->
        <line x1="1050" y1="328" x2="1050" y2="412" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- GitLab -> runner-ci -->
        <path d="M 180,328 V 396 Q 180,404 188,404 H 392" fill="none" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#arrow)"/>
        <!-- GitLab -> runner-infra -->
        <path d="M 156,328 V 476 Q 156,484 164,484 H 392" fill="none" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#arrow)"/>
        <!-- runner-infra -> OOB infra/K8s -->
        <line x1="628" y1="484" x2="896" y2="484" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#arrow)"/>

        <!-- Blocked direct bypass: Site Manager -> API Cluster Client (stops at trust boundary x=852) -->
        <path d="M 628,164 H 808 Q 816,164 816,172 V 236 Q 816,244 824,244 H 844" fill="none" stroke="#bf4520" stroke-width="1.1" stroke-dasharray="4,3"/>
        <line x1="838" y1="238" x2="850" y2="250" stroke="#bf4520" stroke-width="1.6"/>
        <line x1="850" y1="238" x2="838" y2="250" stroke="#bf4520" stroke-width="1.6"/>

        <!-- Arrow labels -->
        <rect x="296" y="104" width="92" height="12" rx="2" fill="#f5f5f5"/>
        <text x="342" y="113" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HTTPS PORTAIL</text>

        <rect x="692" y="104" width="128" height="12" rx="2" fill="#f5f5f5"/>
        <text x="756" y="113" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ROUTE TUNNEL / DNS</text>

        <rect x="348" y="264" width="108" height="12" rx="2" fill="#f5f5f5"/>
        <text x="402" y="273" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">GIT PULL 3 MIN</text>

        <rect x="792" y="264" width="100" height="12" rx="2" fill="#f5f5f5"/>
        <text x="842" y="273" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">OOB 1:5::3 -&gt; 6443</text>

        <rect x="664" y="220" width="144" height="12" rx="2" fill="#f5f5f5"/>
        <text x="736" y="229" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">BLOQUÉ · PAS D'OOB</text>

        <rect x="720" y="460" width="120" height="12" rx="2" fill="#f5f5f5"/>
        <text x="780" y="469" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ANSIBLE · OPENTOFU</text>

        <!-- Nodes: Zone 1 -->
        <rect x="68" y="88" width="224" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="68" y="88" width="224" height="72" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="180" y="120" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Client via Cloudflare</text>
        <text x="180" y="138" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Portail client HTTPS</text>

        <rect x="68" y="248" width="224" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="68" y="248" width="224" height="80" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="76" y="256" width="44" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
        <text x="98" y="265" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FORGE</text>
        <text x="180" y="284" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">gitlab.inetdoc.net</text>
        <text x="180" y="302" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">tenants/tenant-&lt;client&gt;/</text>

        <!-- Nodes: Zone 2 -->
        <rect x="392" y="88" width="236" height="88" rx="6" fill="#f5f5f5"/>
        <rect x="392" y="88" width="236" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="400" y="96" width="68" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="434" y="105" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PORTAL-APPS</text>
        <text x="510" y="128" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Site Manager (Python)</text>
        <text x="510" y="146" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">MariaDB · Jeton ESO OpenBao</text>
        <text x="510" y="160" fill="#5a6580" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Sans interface Multus OOB</text>

        <rect x="548" y="248" width="240" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="548" y="248" width="240" height="80" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <rect x="556" y="256" width="52" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.50)" stroke-width="0.8"/>
        <text x="582" y="265" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PIVOT</text>
        <text x="668" y="284" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ArgoCD (2 réplicas)</text>
        <text x="668" y="302" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">bb21::1 + Multus OOB 1:5::3</text>

        <rect x="392" y="372" width="236" height="60" rx="6" fill="#f5f5f5"/>
        <rect x="392" y="372" width="236" height="60" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="510" y="398" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">runner-ci (bb43::2)</text>
        <text x="510" y="416" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Build &amp; Lint · Aucune patte OOB</text>

        <rect x="392" y="452" width="236" height="60" rx="6" fill="#f5f5f5"/>
        <rect x="392" y="452" width="236" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="510" y="478" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">runner-infra (bb43::1)</text>
        <text x="510" y="496" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">OOB 1:4::3 · Branche main protégée</text>

        <!-- Nodes: Zone 3 -->
        <rect x="896" y="88" width="308" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="896" y="88" width="308" height="72" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="1050" y="120" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Ingress Envoy Client (bb24::1)</text>
        <text x="1050" y="138" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Routage L7 *.&lt;client&gt;.domaine</text>

        <rect x="896" y="248" width="308" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="896" y="248" width="308" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="904" y="256" width="52" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="930" y="265" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API OOB</text>
        <text x="1050" y="284" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">API Cluster Client (kube-vip)</text>
        <text x="1050" y="302" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">fd07:63fe:c5dd:1:2::10:6443</text>

        <rect x="896" y="412" width="308" height="96" rx="6" fill="#f5f5f5"/>
        <rect x="896" y="412" width="308" height="96" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="1050" y="444" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">tenant-&lt;client&gt; + VMs cibles</text>
        <text x="1050" y="464" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Namespace · PSS restricted · CNP</text>
        <text x="1050" y="482" fill="#5a6580" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">État synchronisé par GitOps</text>

        <!-- Legend strip -->
        <line x1="40" y1="556" x2="1240" y2="556" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="576" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LÉGENDE</text>

        <line x1="40" y1="597" x2="72" y2="597" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="80" y="600" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Chemin balisé GitOps (Commit -&gt; Pull ArgoCD -&gt; API OOB)</text>

        <line x1="444" y1="597" x2="476" y2="597" stroke="#bf4520" stroke-width="1.1" stroke-dasharray="4,3"/>
        <text x="484" y="600" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Accès direct bloqué à la frontière OOB</text>

        <line x1="744" y1="597" x2="776" y2="597" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text x="784" y="600" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Appels API Cloudflare et accès portail</text>
      </svg>
    </div>
  </div>
</body>
</html>
